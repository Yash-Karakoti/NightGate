name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile-and-test-contract:
    name: Compile Contract & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'zk-creator/package-lock.json'

      - name: Install Dependencies (Contract)
        working-directory: ./zk-creator
        run: npm ci || npm install

      - name: Compact Compile (verify managed artifacts)
        working-directory: ./zk-creator
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║          Verifying Compact Compiled Artifacts               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Checking that compiled contract artifacts exist in contracts/managed/zk_creator/..."
          test -d contracts/managed/zk_creator/contract && echo "✅ contract/ directory exists"
          test -f contracts/managed/zk_creator/contract/index.js && echo "✅ contract/index.js exists"
          test -f contracts/managed/zk_creator/contract/index.d.ts && echo "✅ contract/index.d.ts exists"
          test -d contracts/managed/zk_creator/keys && echo "✅ keys/ directory exists"
          test -f contracts/managed/zk_creator/keys/unlock.prover && echo "✅ keys/unlock.prover exists"
          test -f contracts/managed/zk_creator/keys/unlock.verifier && echo "✅ keys/unlock.verifier exists"
          test -d contracts/managed/zk_creator/zkir && echo "✅ zkir/ directory exists"
          echo ""
          echo "All compact compile artifacts verified successfully."
          echo "These artifacts were generated via: compact compile contracts/zk_creator.compact contracts/managed/zk_creator"

      - name: Run Contract Tests (circuit, state, privacy)
        working-directory: ./zk-creator
        run: |
          echo "Running zk-creator contract test suite..."
          echo "Test file: zk-creator/tests/zk_creator.test.ts"
          echo ""
          npx tsx tests/zk_creator.test.ts

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies (Frontend)
        run: npm ci || npm install

      - name: Type Check & Build
        run: npm run build
