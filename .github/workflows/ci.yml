name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-contract:
    name: Run Contract Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'zk-creator/package-lock.json'
      
      - name: Install Dependencies (Contract)
        working-directory: ./zk-creator
        run: npm ci || npm install
      
      - name: Run Tests
        working-directory: ./zk-creator
        run: npm test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      
      - name: Install Dependencies (Frontend)
        run: npm ci || npm install
      
      - name: Type Check & Build
        run: npm run build
